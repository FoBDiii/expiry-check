plugins {
    id 'com.android.application'
}

// GitHub Actions passes its run number so every build installs as an update.
def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace 'uk.fo.expirycheck'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.fo.expirycheck'
        minSdk 29
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // One fixed key so new builds install over old ones without losing data.
    signingConfigs {
        shared {
            storeFile file('signing.keystore')
            storePassword 'expirycheck'
            keyAlias 'expirycheck'
            keyPassword 'expirycheck'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lines up the Kotlin library versions pulled in by Google's libraries (avoids duplicate classes).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // Google's barcode scanner: opens its own camera screen, so the app needs no camera permission.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // FileProvider, for handing the camera app a place to save product photos.
    implementation 'androidx.core:core:1.13.1'
}
